services:
  api:
    build: ./backend
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/code
      - ./data:/data
    environment:
      - DATABASE_URL=sqlite:////data/media-manager.db
      - DOWNLOAD_DIR=/data/downloads
      - MAX_CONCURRENT_JOBS=3
      # - API_KEY=change-me
      # - YTDLP_COOKIES_FROM_BROWSER=firefox

  web:
    build: ./frontend
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      - VITE_API_URL=http://localhost:8000
      - VITE_PROXY_TARGET=http://api:8000
    depends_on:
      - api
